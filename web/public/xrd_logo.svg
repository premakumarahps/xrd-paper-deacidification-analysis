<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="xrdBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="latticeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Atomic Lattice Planes -->
  <line x1="6" y1="28" x2="42" y2="28" stroke="url(#latticeGrad)" stroke-width="2" stroke-dasharray="2 3"/>
  <line x1="6" y1="38" x2="42" y2="38" stroke="url(#latticeGrad)" stroke-width="2" stroke-dasharray="2 3"/>

  <!-- Atoms on Top Plane -->
  <circle cx="12" cy="28" r="3" fill="#38bdf8" stroke="#0369a1" stroke-width="1"/>
  <circle cx="24" cy="28" r="3.5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="36" cy="28" r="3" fill="#38bdf8" stroke="#0369a1" stroke-width="1"/>

  <!-- Atoms on Bottom Plane -->
  <circle cx="12" cy="38" r="3" fill="#0284c7"/>
  <circle cx="24" cy="38" r="3.5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="36" cy="38" r="3" fill="#0284c7"/>

  <!-- Incident X-Ray Wave 1 -->
  <path d="M8 8 L24 28 L40 8" stroke="url(#xrdBeam)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Incident X-Ray Wave 2 -->
  <path d="M4 14 L24 38 L44 14" stroke="url(#xrdBeam)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- Peak Detector Arc -->
  <path d="M18 6 Q24 3 30 6" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <circle cx="24" cy="4" r="1.5" fill="#f59e0b"/>
</svg>
